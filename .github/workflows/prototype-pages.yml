# .github/workflows/prototype-pages.yml
name: Deploy Carbon Prototype Pages

on:
  push:
    branches: [develop]
    paths:
      - "prototypes/carbon/**"
      - ".github/workflows/prototype-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: prototype-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/configure-pages@v5

      - name: Prepare static prototype
        run: |
          mkdir -p _site
          cp -R prototypes/carbon/. _site/
          cp prototypes/carbon/app-publish-list.html _site/index.html
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
